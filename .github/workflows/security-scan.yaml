name: Security Scan (reusable)

# SSDLC evidence for one branch (SEC0025 vulnerability scanning, SEC0027
# SBOM). Called by security.yaml, which decides which branches to scan.
#
# The product is the landscape-dashboard .deb (the package name from
# debian/control): static assets bundled from the npm dependency tree in
# pnpm-lock.yaml. The deb itself carries no package metadata, so the SBOM and
# the vulnerability report come from the lockfile (production dependencies
# only), and the deb is what gets submitted to the central secscan service.
#
# Everything is anchored to what shipped: `meta` reads the version and the
# commit out of the branch's ppa-build-* publish record, which
# release-and-build.yml writes when it publishes, and every other job checks
# out that commit. A chore(deps) push does not bump the version and the
# release workflow skips publishing for it, so without the anchor the scan
# would describe dependencies that never shipped.
#
# Outputs per run:
#   - sbom artifact, and on release/point refs a commit of the SBOM to the
#     unprotected `sbom` branch (one file per release branch) so it outlives
#     GitHub's artifact retention and can be diffed between versions. Release
#     and point branches themselves are ruleset-protected and refuse direct
#     pushes, which is why the SBOM does not live next to the code.
#   - trivy vulnerability report (all severities, unfiltered) for the SSDLC
#     vulnerability tracker.
#   - secscan submission of the built .deb with SSDLC product metadata
#     (release/point refs only).
on:
  workflow_call:
    inputs:
      ref:
        description: Branch to scan (release/YY.MM, point/YY.MM.N or main)
        required: true
        type: string

# Read-only by default. Only the job that commits the SBOM needs to push,
# and it gets write access on its own; the Trivy steps never see a token
# that can write.
permissions:
  contents: read

jobs:
  meta:
    name: Resolve SSDLC metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      cycle: ${{ steps.meta.outputs.cycle }}
      channel: ${{ steps.meta.outputs.channel }}
      is_release_ref: ${{ steps.meta.outputs.is_release_ref }}
      scan_sha: ${{ steps.meta.outputs.scan_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Determine version, cycle, channel and the commit to scan
        id: meta
        env:
          BRANCH: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          # release/YY.MM and point/YY.MM.N pin the cycle by name; anything
          # else (main) falls back to the calendar rule.
          IS_RELEASE_REF=false
          if [[ "$BRANCH" =~ ^(release|point)/([0-9]{2}\.(04|10))(\.[0-9]+)?$ ]]; then
            CYCLE="${BASH_REMATCH[2]}"
            IS_RELEASE_REF=true
          else
            read -r YY MM <<<"$(date -u +'%y %m')"
            MM=$((10#$MM))
            if (( MM <= 4 )); then
              CYCLE="${YY}.04"
            elif (( MM <= 10 )); then
              CYCLE="${YY}.10"
            else
              CYCLE="$(printf '%02d' $((10#$YY + 1))).04"
            fi
          fi

          if [[ "$IS_RELEASE_REF" != "true" ]]; then
            # main never ships, so there is no published version to describe:
            # scan the tip and label the artifacts with the commit.
            SCAN_SHA=$(git rev-parse HEAD)
            VERSION="${BRANCH//\//-}-${SCAN_SHA:0:7}"
            CHANNEL=edge
          else
            # What actually shipped from this branch. release-and-build.yml
            # publishes every build to its own ppa-build-* branch with
            #   Build v<version> from <branch> [<sha>]
            # as the commit subject, so that tip is the authoritative
            # version <-> commit record, written at publish time by the run
            # that did the publishing.
            #
            # Recomputing it with scripts/calculate-version.cjs would instead
            # read whichever copy of the script lives on the scanned branch:
            # the oldest release branches do not carry it at all, and older
            # ones derive the build number from GITHUB_RUN_NUMBER, which here
            # is this workflow's run number rather than the release build's —
            # a version that was never published.
            case "$BRANCH" in
              release/*) DEST="ppa-build-${BRANCH#release/}" ;;
              point/*) DEST="ppa-build-${BRANCH#point/}" ;;
            esac

            if ! git fetch --depth=1 --no-tags origin \
                "+refs/heads/${DEST}:refs/remotes/origin/${DEST}"; then
              echo "::error::No publish record for ${BRANCH}: origin/${DEST} does not exist. Nothing has been released from this branch, so there is nothing to scan."
              exit 1
            fi

            SUBJECT=$(git log -1 --format=%s "refs/remotes/origin/${DEST}")
            if [[ ! "$SUBJECT" =~ ^Build\ v(.+)\ from\ (.+)\ \[([0-9a-f]{40})\]$ ]]; then
              echo "::error::Could not read a version and commit from the ${DEST} tip: '${SUBJECT}'. Expected 'Build v<version> from <branch> [<sha>]'."
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}"
            FROM_BRANCH="${BASH_REMATCH[2]}"
            SCAN_SHA="${BASH_REMATCH[3]}"

            if [[ "$FROM_BRANCH" != "$BRANCH" ]]; then
              echo "::error::${DEST} was last published from ${FROM_BRANCH}, not ${BRANCH}; refusing to describe one branch's release as another's."
              exit 1
            fi

            # secscan channel is the risk level only. The release workflow
            # already suffixes -rc until the branch is promoted in
            # RELEASED_BRANCHES, so the published version carries the answer.
            if [[ "$VERSION" == *-rc ]]; then
              CHANNEL=candidate
            else
              CHANNEL=stable
            fi

            echo "${DEST} last published v${VERSION} from ${SCAN_SHA}."
          fi

          {
            echo "version=$VERSION"
            echo "cycle=$CYCLE"
            echo "channel=$CHANNEL"
            echo "is_release_ref=$IS_RELEASE_REF"
            echo "scan_sha=$SCAN_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "ref=$BRANCH version=$VERSION cycle=$CYCLE channel=$CHANNEL release_ref=$IS_RELEASE_REF sha=$SCAN_SHA"

  sbom:
    name: Generate SBOM
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.scan_sha }}

      # Source SBOM from pnpm-lock.yaml. Trivy excludes devDependencies for
      # pnpm lockfiles by default, which matches what ends up in the bundle.
      - name: Generate SPDX SBOM from the lockfile
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: spdx-json
          output: landscape-ui-${{ needs.meta.outputs.version }}.spdx.json
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ needs.meta.outputs.version }}
          path: landscape-ui-${{ needs.meta.outputs.version }}.spdx.json
          retention-days: 90

  # Persist in git: GitHub artifacts expire, and the SSDLC review wants to
  # diff SBOMs between versions to see when a vulnerability was introduced.
  # The file goes to the `sbom` branch under the release branch's name
  # (release/26.10/landscape-ui.spdx.json), so each release branch has its
  # own diffable history there. A `commit` file next to it records the
  # scanned commit: scans of the same ref can overlap (a weekly run and a
  # push), so a run only writes when its commit is newer than the one
  # already recorded. Newest wins regardless of which run finishes last,
  # and reruns of an unchanged release do not add noise commits.
  #
  # Its own job so that the write token exists only here, around plain git,
  # and never in the job that runs the third-party Trivy action.
  persist-sbom:
    name: Commit SBOM to the sbom branch
    needs: [meta, sbom]
    if: needs.meta.outputs.is_release_ref == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.scan_sha }}
          # Full history so the commit step can tell whether the SBOM already
          # on the sbom branch comes from a newer commit than this one.
          fetch-depth: 0

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ needs.meta.outputs.version }}
          path: ${{ runner.temp }}/sbom

      - name: Commit SBOM to the sbom branch
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BRANCH: ${{ inputs.ref }}
          SCAN_SHA: ${{ needs.meta.outputs.scan_sha }}
          SBOM_BRANCH: sbom
        run: |
          set -e
          SRC="$RUNNER_TEMP/sbom/landscape-ui-${VERSION}.spdx.json"
          DEST="${BRANCH}/landscape-ui.spdx.json"
          COMMIT_FILE="${BRANCH}/commit"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Race protection: another release branch may push to the sbom
          # branch at the same time. Each attempt starts from the branch tip
          # and reapplies the generated file, so there is never a rebase that
          # can conflict.
          for attempt in 1 2 3; do
            if git fetch origin "$SBOM_BRANCH"; then
              git switch -C "$SBOM_BRANCH" FETCH_HEAD
            else
              echo "No $SBOM_BRANCH branch yet; creating it."
              # A failed first push leaves the local branch behind, checked
              # out; detach so it can be deleted and --orphan can recreate it.
              git switch --detach 2>/dev/null || true
              git branch -D "$SBOM_BRANCH" 2>/dev/null || true
              git switch --orphan "$SBOM_BRANCH"
            fi

            if [[ -f "$COMMIT_FILE" ]]; then
              EXISTING=$(cat "$COMMIT_FILE")
              if [[ "$EXISTING" == "$SCAN_SHA" ]]; then
                echo "SBOM for ${SCAN_SHA} is already on ${SBOM_BRANCH}; nothing to commit."
                exit 0
              fi
              # The recorded commit may come from a scan that started after
              # this one checked out, so it is not necessarily here yet;
              # without the object the comparison below cannot run at all.
              if ! git cat-file -e "${EXISTING}^{commit}" 2>/dev/null; then
                echo "Recorded commit ${EXISTING} is not present locally; fetching it."
                git fetch --no-tags origin "$EXISTING" \
                  || git fetch --no-tags origin "$BRANCH" \
                  || true
              fi

              # Ours is newer only if the recorded commit is an ancestor of
              # it. Everything else (ours is the ancestor, the two have
              # diverged, or git cannot compare them) must not read as "ours
              # is newer": that is exactly how an older or unrelated scan
              # would overwrite a newer SBOM.
              if git merge-base --is-ancestor "$SCAN_SHA" "$EXISTING"; then
                echo "SBOM on ${SBOM_BRANCH} is from ${EXISTING}, newer than ${SCAN_SHA}; not overwriting."
                exit 0
              fi
              ANCESTOR_RC=0
              git merge-base --is-ancestor "$EXISTING" "$SCAN_SHA" || ANCESTOR_RC=$?
              if [[ "$ANCESTOR_RC" -ne 0 ]]; then
                echo "::error::Recorded commit ${EXISTING} on ${SBOM_BRANCH} is not an ancestor of ${SCAN_SHA} (git merge-base exit ${ANCESTOR_RC}), so the two cannot be ordered; refusing to overwrite. If ${BRANCH} was rewritten on purpose, fix ${COMMIT_FILE} on ${SBOM_BRANCH} by hand."
                exit 1
              fi
            fi

            mkdir -p "$(dirname "$DEST")"
            cp "$SRC" "$DEST"
            echo "$SCAN_SHA" > "$COMMIT_FILE"

            git add "$DEST" "$COMMIT_FILE"
            git commit -m "sbom: ${BRANCH} at ${VERSION} (${SCAN_SHA:0:7})"

            if git push origin "$SBOM_BRANCH"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; refetching and retrying."
          done
          echo "Failed to push SBOM after 3 attempts" >&2
          exit 1

  vulnerability-report:
    name: Vulnerability report (Trivy)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.scan_sha }}

      # Trivy honours a .trivyignore in the scanned tree by default, which
      # would let the release branch decide what the SSDLC tracker gets to
      # see. Point both scans at an empty ignore file outside the checkout
      # instead. (The action insists the file exists, so /dev/null won't do.)
      - name: Disable repository ignore files
        run: ': > "$RUNNER_TEMP/empty.trivyignore"'

      # Full, unfiltered report for the SSDLC vulnerability tracker: every
      # severity, fixed or not. SEC0025 says do not delete any finding.
      - name: Scan lockfile (full report)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-report-${{ needs.meta.outputs.version }}.json
          trivyignores: ${{ runner.temp }}/empty.trivyignore
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ needs.meta.outputs.version }}
          path: trivy-report-${{ needs.meta.outputs.version }}.json
          retention-days: 90

      # Gate: high and critical findings with an available fix must be
      # remediated before the cycle ends, so they fail the job here.
      - name: Fail on fixable HIGH/CRITICAL findings
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
          trivyignores: ${{ runner.temp }}/empty.trivyignore
          github-pat: ${{ secrets.GITHUB_TOKEN }}

  build-deb:
    name: Build .deb for scanning
    needs: meta
    if: needs.meta.outputs.is_release_ref == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.scan_sha }}

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same build inputs as release-and-build.yml, at the commit the release
      # workflow built, so the scanned deb matches what was published.
      - name: Production build
        run: pnpm run build
        env:
          VITE_APP_VERSION: ${{ needs.meta.outputs.version }}
          VITE_APP_COMMIT: ${{ needs.meta.outputs.scan_sha }}
          VITE_API_URL: /api/v2/
          VITE_API_URL_OLD: /api/
          VITE_ROOT_PATH: /portal/

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper devscripts

      - name: Build .deb package
        env:
          DEBFULLNAME: Landscape Team
          DEBEMAIL: landscape-team@canonical.com
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          # debian/rules at this commit expects the vite output at the root:
          # assets/, index.html, favicon.svg, and from 26.10 on icons/. Only
          # move what this build produced so older release branches package.
          cp -r dist/assets .
          cp dist/index.html dist/favicon.svg .
          if [ -d dist/icons ]; then cp -r dist/icons .; fi
          rm -rf dist

          dch --newversion "${VERSION}-0landscape0" \
              --distribution jammy \
              "Release ${VERSION} for jammy"

          tar czf "../landscape-dashboard_${VERSION}.orig.tar.gz" \
            assets favicon.svg index.html $( [ -d icons ] && echo icons )

          dpkg-buildpackage -us -uc -b
          cp ../landscape-dashboard_*.deb .

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-for-scan-${{ needs.meta.outputs.version }}
          path: landscape-dashboard_*.deb
          retention-days: 1

  secscan:
    name: Submit .deb to secscan
    needs: [meta, build-deb]
    if: needs.meta.outputs.is_release_ref == 'true'
    runs-on:
      [self-hosted, self-hosted-linux-amd64-jammy-private-endpoint-medium]
    timeout-minutes: 30
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-for-scan-${{ needs.meta.outputs.version }}

      - name: Install secscan client
        run: |
          sudo snap install canonical-secscan-client
          sudo snap connect canonical-secscan-client:home system:home

      - name: Run security scan
        id: scan
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          CYCLE: ${{ needs.meta.outputs.cycle }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          set +e
          DEB=$(ls landscape-dashboard_*.deb | head -n1)
          echo "Submitting $DEB as version=$VERSION cycle=$CYCLE channel=$CHANNEL"
          secscan-client --batch submit \
            --ssdlc-product-name 'landscape-ui' \
            --ssdlc-cycle "$CYCLE" \
            --ssdlc-product-version "$VERSION" \
            --ssdlc-product-channel "$CHANNEL" \
            --scanner trivy \
            --format deb \
            --type package \
            --base jammy \
            --base-arch amd64 \
            "$DEB" \
            --wait-and-print 2>&1 | tee secscan-results.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # The client exits 0 when the scan itself breaks: it prints
          # "Scan has failed.", dumps the scan log on stderr (merged into the
          # results file above) and returns. Only a scan that reports
          # "Scan has succeeded." may pass on its exit code: 0 means no
          # findings, 100 means findings remain, 101 means stale exclusions.
          if ! grep -qx 'Scan has succeeded.' secscan-results.txt; then
            echo "::error::secscan did not complete; see secscan-results.txt"
            exit 1
          fi
          exit "$EXIT_CODE"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secscan-results-${{ needs.meta.outputs.version }}
          path: secscan-results.txt
          retention-days: 90
