name: Vitest shard benchmark case

on:
  workflow_call:
    inputs:
      case-id:
        type: string
        required: true
      total:
        type: number
        required: true

permissions:
  contents: read

jobs:
  tests:
    name: Test (${{ matrix.shard }}/${{ inputs.total }})
    runs-on: [self-hosted, Linux, large]
    timeout-minutes: 20
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.total == 1 && '[1]' || inputs.total == 2 && '[1,2]' || '[1,2,3,4]') }}
    env:
      SHARD: ${{ matrix.shard }}
      TOTAL: ${{ inputs.total }}
      VITE_API_URL: ${{ vars.API_URL }}
      VITE_API_URL_OLD: ${{ vars.API_URL_OLD }}
      VITE_API_URL_DEB_ARCHIVE: ${{ vars.API_URL_DEB_ARCHIVE }}
      VITE_API_PROXY_TARGET: ${{ vars.API_PROXY_TARGET }}
      VITE_APP_TITLE: Landscape
      VITE_ROOT_PATH: /portal/
      VITE_DETAILED_UPGRADES_VIEW_ENABLED: false
      VITE_APP_VERSION: "26.04.0.12"
      VITE_APP_COMMIT: 1ccf79e8bbd37cc456f3e72357dcdb00ed19f1a6
      VITE_SELF_HOSTED_ENV: true
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v5
        with:
          ref: 1ccf79e8bbd37cc456f3e72357dcdb00ed19f1a6
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record machine and source
        run: |
          mkdir -p benchmark
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync } from "node:fs";
          import { availableParallelism, cpus, totalmem } from "node:os";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const data = {
            source: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
            lockfile: createHash("sha256").update(readFileSync("pnpm-lock.yaml")).digest("hex"),
            node: process.version,
            pnpm: execFileSync("pnpm", ["--version"], { encoding: "utf8" }).trim(),
            vitest: pkg.devDependencies.vitest,
            coverage: pkg.devDependencies["@vitest/coverage-v8"],
            runner: process.env.RUNNER_NAME,
            cpu: cpus()[0]?.model,
            availableCpus: availableParallelism(),
            logicalCpus: cpus().length,
            totalMemoryBytes: totalmem(),
            maxWorkers: 8,
            shard: Number(process.env.SHARD),
            total: Number(process.env.TOTAL)
          };
          writeFileSync(`benchmark/machine-${process.env.SHARD}.json`, JSON.stringify(data, null, 2));
          console.log(JSON.stringify(data, null, 2));
          NODE

      - name: Run tests with coverage
        run: |
          case "$TOTAL" in
            1|2|4) ;;
            *) echo "::error::Unsupported shard count: $TOTAL"; exit 1 ;;
          esac
          args=(
            run --coverage --maxWorkers=8
            --reporter=default --reporter=json
            "--outputFile.json=benchmark/tests-$SHARD.json"
          )
          if [ "$TOTAL" -gt 1 ]; then
            args+=(
              "--shard=$SHARD/$TOTAL"
              --reporter=blob
              "--outputFile.blob=vitest-blob/blob-$SHARD.json"
              --coverage.reporter=text-summary
              --coverage.thresholds.statements=0
              --coverage.thresholds.lines=0
              --coverage.thresholds.functions=0
              --coverage.thresholds.branches=0
            )
          fi
          /usr/bin/time --quiet \
            -f '{"elapsedSeconds":%e,"userSeconds":%U,"systemSeconds":%S,"maxRssKiB":%M,"exitCode":%x}' \
            -o "benchmark/timing-$SHARD.json" \
            pnpm exec vitest "${args[@]}"

      - name: Upload shard data
        if: ${{ !cancelled() && inputs.total > 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ inputs.case-id }}-blob-${{ matrix.shard }}
          path: |
            vitest-blob
            benchmark
          retention-days: 7
          if-no-files-found: error

      - name: Upload final report
        if: ${{ !cancelled() && inputs.total == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ inputs.case-id }}-direct
          path: |
            benchmark
            reports
          retention-days: 7
          if-no-files-found: error

  merge:
    name: Merge (${{ matrix.kind }})
    needs: tests
    if: ${{ always() && !cancelled() && inputs.total > 1 }}
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    timeout-minutes: 10
    environment: dev
    env:
      VITE_API_URL: ${{ vars.API_URL }}
      VITE_API_URL_OLD: ${{ vars.API_URL_OLD }}
      VITE_API_URL_DEB_ARCHIVE: ${{ vars.API_URL_DEB_ARCHIVE }}
      VITE_API_PROXY_TARGET: ${{ vars.API_PROXY_TARGET }}
      VITE_APP_TITLE: Landscape
      VITE_ROOT_PATH: /portal/
      VITE_DETAILED_UPGRADES_VIEW_ENABLED: false
      VITE_APP_VERSION: "26.04.0.12"
      VITE_APP_COMMIT: 1ccf79e8bbd37cc456f3e72357dcdb00ed19f1a6
      VITE_SELF_HOSTED_ENV: true
      NODE_OPTIONS: --max_old_space_size=4096
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: self-hosted
            runs-on: '["self-hosted", "Linux", "large"]'
          - kind: github-hosted
            runs-on: '"ubuntu-latest"'
    steps:
      - name: Require every shard to pass
        if: ${{ needs.tests.result != 'success' }}
        run: |
          echo "::error::A test shard failed; this trial cannot pass."
          exit 1

      - name: Checkout pinned source
        uses: actions/checkout@v5
        with:
          ref: 1ccf79e8bbd37cc456f3e72357dcdb00ed19f1a6
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-${{ inputs.case-id }}-blob-*
          path: benchmark-input
          merge-multiple: true

      - name: Verify shard inputs
        env:
          TOTAL: ${{ inputs.total }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync } from "node:fs";
          const files = readdirSync("benchmark-input/vitest-blob").sort();
          const expected = Array.from({ length: Number(process.env.TOTAL) }, (_, index) => `blob-${index + 1}.json`).sort();
          if (JSON.stringify(files) !== JSON.stringify(expected)) {
            throw new Error(`Expected ${JSON.stringify(expected)}, found ${JSON.stringify(files)}`);
          }
          NODE

      - name: Merge reports and check coverage
        run: |
          mkdir -p benchmark
          /usr/bin/time --quiet \
            -f '{"elapsedSeconds":%e,"userSeconds":%U,"systemSeconds":%S,"maxRssKiB":%M,"exitCode":%x}' \
            -o benchmark/timing-merge.json \
            pnpm exec vitest --merge-reports=benchmark-input/vitest-blob --coverage \
              --reporter=default --reporter=json --outputFile.json=benchmark/tests-merge.json

      - name: Upload final report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ inputs.case-id }}-merge-${{ matrix.kind }}
          path: |
            benchmark
            reports
          retention-days: 7
          if-no-files-found: error
