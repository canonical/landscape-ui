name: Upload signed beta source (reusable)

on:
  workflow_call:
    inputs:
      series:
        required: true
        type: string
      version:
        required: true
        type: string
      marker:
        required: true
        type: string
    secrets:
      signing-key:
        required: true
      imap-password:
        required: false
    outputs:
      result:
        value: ${{ jobs.upload.outputs.result }}

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      result: ${{ steps.upload.outputs.result }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: beta-source
          path: ${{ runner.temp }}/beta-source
      - name: Install signing and upload tools
        run: sudo apt-get update && sudo apt-get install -y devscripts dput
      - name: Sign, upload and check Launchpad acceptance
        id: upload
        env:
          SERIES: ${{ inputs.series }}
          VERSION: ${{ inputs.version }}
          MARKER: ${{ inputs.marker }}
          GPG_PRIVATE_KEY: ${{ secrets.signing-key }}
          LAUNCHPAD_IMAP_HOST: ${{ vars.LAUNCHPAD_IMAP_HOST }}
          LAUNCHPAD_IMAP_USER: ${{ vars.LAUNCHPAD_IMAP_USER }}
          LAUNCHPAD_IMAP_PASSWORD: ${{ secrets.imap-password }}
          LAUNCHPAD_VERIFY_REJECTION_EMAIL: ${{ vars.LAUNCHPAD_VERIFY_REJECTION_EMAIL }}
        run: python3 scripts/launchpad-beta.py upload "$VERSION" "$SERIES" --marker "$MARKER" --directory "$RUNNER_TEMP/beta-source"
