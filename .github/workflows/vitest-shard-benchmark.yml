name: Vitest shard benchmark

on:
  push:
    branches: [rubinaga-ci-performance-strategy]
    paths:
      - .github/workflows/vitest-shard-benchmark.yml
      - .github/workflows/vitest-shard-benchmark-case.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitest-shard-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  warm-cache:
    name: Warm dependency cache
    runs-on: [self-hosted, Linux, large]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 1ccf79e8bbd37cc456f3e72357dcdb00ed19f1a6
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  # Rotate the order so one configuration does not always run first or last.
  r1-single:
    name: R1 / 1 runner
    needs: warm-cache
    uses: ./.github/workflows/vitest-shard-benchmark-case.yml
    with:
      case-id: r1-single
      total: 1

  r1-two:
    name: R1 / 2 shards
    needs: [warm-cache, r1-single]
    if: ${{ !cancelled() && needs.warm-cache.result == 'success' }}
    uses: ./.github/workflows/vitest-shard-benchmark-case.yml
    with:
      case-id: r1-two
      total: 2

  r1-four:
    name: R1 / 4 shards
    needs: [warm-cache, r1-two]
    if: ${{ !cancelled() && needs.warm-cache.result == 'success' }}
    uses: ./.github/workflows/vitest-shard-benchmark-case.yml
    with:
      case-id: r1-four
      total: 4

  r2-two:
    name: R2 / 2 shards
    needs: [warm-cache, r1-four]
    if: ${{ !cancelled() && needs.warm-cache.result == 'success' }}
    uses: ./.github/workflows/vitest-shard-benchmark-case.yml
    with:
      case-id: r2-two
      total: 2

  r2-four:
    name: R2 / 4 shards
    needs: [warm-cache, r2-two]
    if: ${{ !cancelled() && needs.warm-cache.result == 'success' }}
    uses: ./.github/workflows/vitest-shard-benchmark-case.yml
    with:
      case-id: r2-four
      total: 4

  r2-single:
    name: R2 / 1 runner
    needs: [warm-cache, r2-four]
    if: ${{ !cancelled() && needs.warm-cache.result == 'success' }}
    uses: ./.github/workflows/vitest-shard-benchmark-case.yml
    with:
      case-id: r2-single
      total: 1

  r3-four:
    name: R3 / 4 shards
    needs: [warm-cache, r2-single]
    if: ${{ !cancelled() && needs.warm-cache.result == 'success' }}
    uses: ./.github/workflows/vitest-shard-benchmark-case.yml
    with:
      case-id: r3-four
      total: 4

  r3-single:
    name: R3 / 1 runner
    needs: [warm-cache, r3-four]
    if: ${{ !cancelled() && needs.warm-cache.result == 'success' }}
    uses: ./.github/workflows/vitest-shard-benchmark-case.yml
    with:
      case-id: r3-single
      total: 1

  r3-two:
    name: R3 / 2 shards
    needs: [warm-cache, r3-single]
    if: ${{ !cancelled() && needs.warm-cache.result == 'success' }}
    uses: ./.github/workflows/vitest-shard-benchmark-case.yml
    with:
      case-id: r3-two
      total: 2
