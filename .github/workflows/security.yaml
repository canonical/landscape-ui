name: Security Scan

# Decides which branches get the SSDLC scan and hands each one to
# security-scan.yaml (the reusable workflow that does the work).
#
#   release publish finishes        -> the branch it published, once
#                                      release-and-build.yml has recorded the
#                                      version and commit the scan reads
#   workflow_dispatch               -> the `ref` input, or the branch it was
#                                      dispatched from
#   weekly schedule                 -> main plus every supported release
#                                      branch, so shipped releases are
#                                      rechecked for newly disclosed CVEs
#                                      without anyone pushing to them
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to scan (defaults to the branch this is dispatched from)
        required: false
        type: string
  # Not `push`: the scan describes the published build, and on a push the
  # release workflow has not published it yet, so the scan would still be
  # looking at the previous one.
  workflow_run:
    workflows: ["Release and PPA Build"]
    types: [completed]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || inputs.ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  targets:
    name: Pick branches to scan
    # No gate on the release run's conclusion: release-and-build.yml
    # force-pushes the ppa-build-* record before it tags the commit and
    # before its deb job runs, so a run that failed or was cancelled after
    # that point still shipped a build Launchpad will pick up. The scan
    # anchors to the publish record and `meta` fails when there is none, so
    # a run that published nothing costs one redundant rescan of the
    # previous release, and one that published is never left unscanned.
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.pick.outputs.refs }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - name: Resolve the branch list
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ inputs.ref }}
          PUBLISHED_REF: ${{ github.event.workflow_run.head_branch }}
          # Comma/space-separated release/point branches still under
          # support, e.g. "release/26.10,release/26.04,point/26.04.2".
          # Unset: only the highest release/YY.MM on origin is scanned.
          SUPPORTED_RELEASE_BRANCHES: ${{ vars.SUPPORTED_RELEASE_BRANCHES }}
        run: |
          case "$EVENT" in
            schedule)
              SUPPORTED="$SUPPORTED_RELEASE_BRANCHES"
              if [[ -z "$SUPPORTED" ]]; then
                SUPPORTED=$(git branch -r --list 'origin/release/*' \
                  | sed 's|^[ *]*origin/||' \
                  | grep -E '^release/[0-9]{2}\.(04|10)$' \
                  | sort -V \
                  | tail -n1 || true)
                echo "SUPPORTED_RELEASE_BRANCHES unset; falling back to ${SUPPORTED:-<none>}"
              fi
              REFS="main $(echo "$SUPPORTED" | tr ',' ' ')"
              ;;
            workflow_dispatch)
              REFS="${DISPATCH_REF:-$GITHUB_REF_NAME}"
              ;;
            workflow_run)
              REFS="$PUBLISHED_REF"
              ;;
            *)
              REFS="$GITHUB_REF_NAME"
              ;;
          esac

          JSON=$(printf '%s\n' $REFS | sed 's|^refs/heads/||' | jq -R . | jq -sc 'unique')
          echo "refs=$JSON" >> "$GITHUB_OUTPUT"
          echo "Scanning: $JSON"

  scan:
    name: Scan ${{ matrix.ref }}
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJson(needs.targets.outputs.refs) }}
    # Cap for the called workflow; inside it only the SBOM job uses write.
    permissions:
      contents: write
    uses: ./.github/workflows/security-scan.yaml
    with:
      ref: ${{ matrix.ref }}
