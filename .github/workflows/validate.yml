name: Validate

on:
  pull_request:
    branches: [main, "release/**", "point/**"]
  merge_group:
    types: [checks_requested]

# Read-only token by default; jobs that need more declare it themselves.
permissions:
  contents: read

# PRs: cancel superseded runs on the same branch, so that a push does not
# leave the previous commit's jobs queued on the self-hosted runners.
# Merge queue: never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # The only type check in CI (the e2e build no longer runs tsc). It lives
      # in this job so it stays behind the required "ESLint" check.
      - name: Type check (tsgo)
        run: pnpm run typecheck

      - name: Run ESLint
        # Report lint results even when the type check fails.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # 4 workers matches ubuntu-latest's vCPUs; "auto" oversubscribes memory
        # because each worker builds its own TypeScript program.
        run: pnpm eslint --cache --concurrency=4

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier
        run: pnpm prettier --check src

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stylelint
        run: pnpm stylelint "src/**/*.module.scss"

  e2e-tests:
    name: Playwright (${{ matrix.name }})
    # Fork PR runs execute unreviewed code, so keep them off the persistent
    # self-hosted runners. Merge-queue runs need an approving review first.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "large"]') }}
    timeout-minutes: 30
    container:
      # Keep in sync with @playwright/test in package.json (the "Check
      # Playwright image version" step fails on drift). A mismatched image
      # makes every run re-download the browsers and apt-upgrade their deps.
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: saas
            name: SaaS
            self_hosted_env: "false"
            msw_enabled: "false"
          - target: self-hosted
            name: self-hosted
            self_hosted_env: "true"
            msw_enabled: "false"
    env:
      # vars are not passed to fork PRs. None of these values are secret (the
      # dev backend is public and the E2E credentials are committed), so fall
      # back to them only there; a missing var still fails same-repo runs.
      VITE_API_URL: ${{ github.event.pull_request.head.repo.fork && (vars.API_URL || '/api/v2/') || vars.API_URL }}
      VITE_API_URL_OLD: ${{ github.event.pull_request.head.repo.fork && (vars.API_URL_OLD || '/api/') || vars.API_URL_OLD }}
      VITE_API_URL_DEB_ARCHIVE: ${{ github.event.pull_request.head.repo.fork && (vars.API_URL_DEB_ARCHIVE || '/debarchive/v1/') || vars.API_URL_DEB_ARCHIVE }}
      VITE_API_PROXY_TARGET: ${{ github.event.pull_request.head.repo.fork && (vars.API_PROXY_TARGET || 'https://landscape.yuriy.works') || vars.API_PROXY_TARGET }}
      VITE_APP_TITLE: Landscape
      VITE_ROOT_PATH: /
      VITE_DETAILED_UPGRADES_VIEW_ENABLED: true
      VITE_APP_VERSION: "26.04.0.12"
      VITE_APP_COMMIT: "abcd123"
      VITE_SELF_HOSTED_ENV: ${{ matrix.self_hosted_env }}
      VITE_MSW_ENABLED: ${{ matrix.msw_enabled }}
      DEBUG: "pw:webserver"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Playwright image version
        run: |
          IMAGE=$(grep -oP 'mcr\.microsoft\.com/playwright:v\K[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/validate.yml | head -n1)
          PKG=$(node -p "require('@playwright/test/package.json').version")
          if [ "$IMAGE" != "$PKG" ]; then
            echo "::error::Playwright container image is v$IMAGE but @playwright/test is $PKG. Update the container image tag in validate.yml."
            exit 1
          fi

      # Vite only: lint and the type check run in the ESLint job.
      - name: Build the project
        run: pnpm run build:e2e
        env:
          VITE_ROOT_PATH: /
          VITE_MSW_ENABLED: ${{ matrix.msw_enabled }}
          VITE_SELF_HOSTED_ENV: ${{ matrix.self_hosted_env }}

      # Both projects use Desktop Chrome; the matching image already ships it.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run ${{ matrix.name }} tests
        run: pnpm exec playwright test --project=${{ matrix.target }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.target }}
          path: playwright-report
          retention-days: 30

  unit-tests:
    name: Vitest (shard ${{ matrix.shard }}/3)
    # Fork PR runs execute unreviewed code, so keep them off the persistent
    # self-hosted runners. Merge-queue runs need an approving review first.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "large"]') }}
    timeout-minutes: 30
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # vars are not passed to fork PRs; fall back to the .env.production
      # paths only there, so a missing var still fails same-repo runs.
      VITE_API_URL: ${{ github.event.pull_request.head.repo.fork && (vars.API_URL || '/api/v2/') || vars.API_URL }}
      VITE_API_URL_OLD: ${{ github.event.pull_request.head.repo.fork && (vars.API_URL_OLD || '/api/') || vars.API_URL_OLD }}
      VITE_API_URL_DEB_ARCHIVE: ${{ github.event.pull_request.head.repo.fork && (vars.API_URL_DEB_ARCHIVE || '/debarchive/v1/') || vars.API_URL_DEB_ARCHIVE }}
      VITE_API_PROXY_TARGET: ${{ vars.API_PROXY_TARGET }}
      VITE_APP_TITLE: Landscape
      VITE_ROOT_PATH: /portal/
      VITE_DETAILED_UPGRADES_VIEW_ENABLED: false
      VITE_APP_VERSION: "26.04.0.12"
      VITE_APP_COMMIT: ${{ github.sha }}
      VITE_SELF_HOSTED_ENV: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Coverage thresholds only make sense for the whole suite, so they are
      # zeroed here and enforced by the "Vitest" job on the merged report.
      - name: Run tests with coverage
        run: >-
          pnpm exec vitest run --coverage
          --shard=${{ matrix.shard }}/3
          --reporter=default --reporter=blob
          --outputFile.blob=vitest-blob/blob-${{ matrix.shard }}.json
          --coverage.reporter=text-summary
          --coverage.thresholds.statements=0
          --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: vitest-blob
          retention-days: 1
          if-no-files-found: error

  # The required "Vitest" check. GitHub counts a skipped required check as
  # passing, so this job always runs and fails unless every shard succeeded.
  unit-tests-merge:
    name: Vitest
    needs: unit-tests
    if: ${{ always() }}
    # Fork PR runs execute unreviewed code, so keep them off the persistent
    # self-hosted runners. Merge-queue runs need an approving review first.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "large"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    environment: dev
    env:
      # vars are not passed to fork PRs; fall back to the .env.production
      # paths only there, so a missing var still fails same-repo runs.
      VITE_API_URL: ${{ github.event.pull_request.head.repo.fork && (vars.API_URL || '/api/v2/') || vars.API_URL }}
      VITE_API_URL_OLD: ${{ github.event.pull_request.head.repo.fork && (vars.API_URL_OLD || '/api/') || vars.API_URL_OLD }}
      VITE_API_URL_DEB_ARCHIVE: ${{ github.event.pull_request.head.repo.fork && (vars.API_URL_DEB_ARCHIVE || '/debarchive/v1/') || vars.API_URL_DEB_ARCHIVE }}
      VITE_API_PROXY_TARGET: ${{ vars.API_PROXY_TARGET }}
      VITE_APP_TITLE: Landscape
      VITE_ROOT_PATH: /portal/
      VITE_DETAILED_UPGRADES_VIEW_ENABLED: false
      VITE_APP_VERSION: "26.04.0.12"
      VITE_APP_COMMIT: ${{ github.sha }}
      VITE_SELF_HOSTED_ENV: true
    steps:
      - name: Require every shard to pass
        if: ${{ needs.unit-tests.result != 'success' }}
        env:
          SHARDS_RESULT: ${{ needs.unit-tests.result }}
        run: |
          echo "::error::Vitest shards finished with result '$SHARDS_RESULT'; see the 'Vitest (shard n/3)' jobs."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: vitest-blob
          merge-multiple: true

      # Fails on any failed test in the blobs and enforces the coverage
      # thresholds from vitest.config.ts against the merged coverage.
      - name: Merge reports and check coverage
        run: pnpm exec vitest --merge-reports=vitest-blob --coverage
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: ${{ github.workspace }}/reports
          retention-days: 30

  verify:
    name: Changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - name: Verify changeset present
        if: github.event.pull_request.base.ref
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: | # js
          git fetch origin "$BASE_REF" --depth=1

          # Only look at *added* .md files under .changeset/, excluding the
          # static README. Empty changesets count — they still create a file.
          ADDED=$(git diff --name-only --diff-filter=A "origin/$BASE_REF"...HEAD \
            -- '.changeset/*.md' \
            | grep -vE '^\.changeset/README\.md$' || true)

          if [ -z "$ADDED" ]; then
            echo "::error::No changeset added under .changeset/. Run 'pnpm changeset' and commit the resulting file."
            echo
            echo "If your change genuinely does not warrant a CHANGELOG entry, add an empty changeset:"
            echo "  pnpm changeset --empty"
            exit 1
          fi

          echo "Changeset(s) added in this PR:"
          echo "$ADDED"
