name: Beta Release Prep

# Beta branches (beta/YY.MM-beta.N, cut once per pulse) carry the beta
# identity in their name. When a new one is cut, this workflow prepares the
# release on a beta-prep/<version> branch and opens a PR back against the
# beta branch. The PR (scripts/beta-version-update.cjs):
#   - rolls the pending .changeset/*.md files into CHANGELOG.md under the
#     beta version,
#   - adds the matching YY.MM~beta.N stanza to debian/changelog,
#   - deletes the consumed changesets,
#   - bumps package.json to YY.MM-beta.N.
# Merging the PR is what stamps the beta branch with its release identity.
#
# Push runs fire only on branch CREATION — later pushes to the beta branch
# don't regenerate the PR. Use manual dispatch to regenerate it (e.g. after
# the branch's content changed before the PR was merged).
on:
  push:
    branches: ["beta/**"]
  workflow_dispatch:

permissions:
  contents: read

# One prep PR per beta branch; serialize against re-dispatches.
concurrency:
  group: beta-prep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Manual dispatch ignores the push branch filter, and the parser also
    # accepts bare YY.MM-beta.N (for local use) — so a dispatch on the tag
    # 27.04-beta.3 would otherwise prep from the wrong ref. Beta branches only.
    if: >-
      startsWith(github.ref, 'refs/heads/beta/') &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.created == true)
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.LANDSCAPE_PACKAGER_APP_ID }}
          private-key: ${{ secrets.LANDSCAPE_PACKAGER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # Validates the branch name (failing the job on a bad one), writes the
      # version files, and exposes the derived version as an output — the
      # script's parser is the only place the branch name is parsed.
      - name: Update version files
        id: version
        run: node scripts/beta-version-update.cjs

      - name: Push beta-prep branch
        id: prep
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT_EMAIL: 273197409+landscape-packager[bot]@users.noreply.github.com
        run: |
          git config user.name "landscape-packager[bot]"
          git config user.email "$BOT_EMAIL"
          PREP_BRANCH="beta-prep/${VERSION}"

          # The release owner edits the draft CHANGELOG on the prep PR. If the
          # existing prep branch has commits by anyone but this workflow,
          # refuse to overwrite them: merge or close that PR first. Check the
          # committer too: amending the bot's commit keeps the bot as author.
          REMOTE_SHA=$(git ls-remote --heads origin "refs/heads/$PREP_BRANCH" | cut -f1)
          if [[ -n "$REMOTE_SHA" ]]; then
            OTHERS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${REMOTE_SHA}" \
              --jq ".commits[] | select(.commit.author.email != \"${BOT_EMAIL}\" or .commit.committer.email != \"${BOT_EMAIL}\") | .sha[0:9] + \" \" + .commit.author.name + \" / \" + .commit.committer.name")
            if [[ -n "$OTHERS" ]]; then
              echo "::error::${PREP_BRANCH} has commits not made by this workflow; refusing to overwrite them:"
              echo "$OTHERS"
              echo "Merge or close the existing prep PR (and delete ${PREP_BRANCH}) before re-running."
              exit 1
            fi
          fi

          git checkout -B "$PREP_BRANCH"
          git add CHANGELOG.md package.json debian/changelog .changeset
          if git diff --cached --quiet; then
            echo "Version files already up to date — nothing to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: prepare beta release ${VERSION}"
          # Overwrite only the prep branch state checked above (or create it
          # if it didn't exist), so a concurrent push is never clobbered.
          git push --force-with-lease="refs/heads/${PREP_BRANCH}:${REMOTE_SHA}" \
            origin "$PREP_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open release-prep PR
        if: steps.prep.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ github.ref_name }}
        run: |
          PREP_BRANCH="beta-prep/${VERSION}"
          EXISTING=$(gh pr list --head "$PREP_BRANCH" --state open --json number -q '.[0].number')
          if [[ -n "$EXISTING" ]]; then
            echo "PR #${EXISTING} already open — branch updated, nothing to create."
            exit 0
          fi
          BODY="Automated release preparation for this beta branch.

          - Rolled pending changesets into CHANGELOG.md under the beta version
          - Added the matching debian/changelog stanza (~beta.N, tilde form)
          - Deleted the consumed .changeset/*.md files
          - Bumped package.json to the beta version

          Merging this PR stamps the beta branch with its release identity."
          gh pr create \
            --base "$BASE" \
            --head "$PREP_BRANCH" \
            --title "chore: prepare beta release ${VERSION}" \
            --body "$BODY"
