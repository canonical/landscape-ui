name: Beta Release and PPA Build

on:
  push:
    branches: ["beta/**"]
  workflow_dispatch:
    inputs:
      exercise-retry:
        description: Fail the first attempt after Jammy accepts, to rehearse recovery on this run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'beta-ppa-rehearsal' || 'release' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    # Manual rehearsal runs use only the merged workflow and code from main.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.version.outputs.decision }}
      version: ${{ steps.version.outputs.version }}
      deb-version: ${{ steps.version.outputs.deb-version }}
      marker: ${{ steps.version.outputs.marker }}
      ppa: ${{ steps.version.outputs.ppa }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Resolve publication metadata
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            node scripts/beta-release-version.cjs --rehearsal
          else
            node scripts/beta-release-version.cjs
          fi

  prepare:
    needs: route
    if: github.event_name == 'push' && needs.route.outputs.decision == 'prepare'
    uses: ./.github/workflows/beta-release-prep.yml
    secrets: inherit

  build:
    needs: route
    if: needs.route.outputs.decision == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Find the original dist artifact on retry
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/find-beta-artifact.sh beta-dist build
      - name: Check that the release can be built
        if: steps.retained.outputs.id == ''
        env:
          VERSION: ${{ needs.route.outputs.deb-version }}
          MARKER: ${{ needs.route.outputs.marker }}
          PPA: ${{ needs.route.outputs.ppa }}
        run: python3 scripts/launchpad-beta.py preflight "$VERSION" --ppa "$PPA" --marker "$MARKER"
      - uses: pnpm/setup@v3
        if: steps.retained.outputs.id == ''
        with:
          version: 12
          runtime: node@26
          cache: true
          require-lockfile: true
      - name: Production build
        if: steps.retained.outputs.id == ''
        run: pnpm run build
        env:
          VITE_APP_VERSION: ${{ needs.route.outputs.version }}
          VITE_APP_COMMIT: ${{ github.sha }}
          VITE_API_URL: /api/v2/
          VITE_API_URL_OLD: /api/
          VITE_ROOT_PATH: /portal/
      - name: Retain beta-dist
        if: steps.retained.outputs.id == ''
        uses: actions/upload-artifact@v4
        with:
          name: beta-dist
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish-assets:
    needs: [route, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: beta-dist
          path: dist/
      - name: Publish beta assets
        env:
          VERSION: ${{ needs.route.outputs.version }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          DEST="ppa-build-${GITHUB_REF_NAME#beta/}"
          require_current_tip() {
            local tip
            tip=$(git ls-remote --heads origin "$GITHUB_REF" | cut -f1) || return 1
            if [[ "$tip" != "$BUILD_SHA" ]]; then
              echo "::error::Beta branch tip is ${tip:-missing}, expected $BUILD_SHA. Use the run for the current tip."
              return 1
            fi
          }
          require_current_tip
          git -C dist init --initial-branch=build
          git -C dist add --all
          git -C dist -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Build $VERSION from $GITHUB_REF_NAME [$BUILD_SHA]"
          git fetch ./dist refs/heads/build
          PREVIOUS=$(git ls-remote --heads origin "refs/heads/$DEST" | cut -f1)
          require_current_tip
          git push --force-with-lease="refs/heads/$DEST:$PREVIOUS" origin "FETCH_HEAD:refs/heads/$DEST"

  sbom:
    needs: [route, build]
    uses: ./.github/workflows/beta-sbom.yml
    with:
      version: ${{ needs.route.outputs.version }}

  package-source:
    needs: [route, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Find the original source artifact on retry
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/find-beta-artifact.sh beta-source package-source
      - uses: actions/download-artifact@v4
        if: steps.retained.outputs.id == ''
        with:
          name: beta-dist
          path: dist/
      - name: Prepare Jammy source package
        if: steps.retained.outputs.id == ''
        env:
          DEB_VERSION: ${{ needs.route.outputs.deb-version }}
          MARKER: ${{ needs.route.outputs.marker }}
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential debhelper dpkg-dev
          bash scripts/build-beta-source.sh "$DEB_VERSION" "$RUNNER_TEMP/beta-source" "$MARKER"
      - name: Retain beta-source
        if: steps.retained.outputs.id == ''
        uses: actions/upload-artifact@v4
        with:
          name: beta-source
          path: ${{ runner.temp }}/beta-source
          retention-days: 30
          if-no-files-found: error

  upload-jammy:
    needs: [route, package-source, publish-assets]
    if: >-
      !cancelled() && needs.route.result == 'success' && needs.package-source.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && needs.publish-assets.result == 'skipped') ||
       (github.event_name == 'push' && needs.publish-assets.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Find the original upload inputs on retry
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/find-beta-artifact.sh beta-source package-source
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.retained.outputs.id == '' && 'beta-source' || '' }}
          artifact-ids: ${{ steps.retained.outputs.id }}
          github-token: ${{ steps.retained.outputs.id != '' && github.token || '' }}
          merge-multiple: true
          path: ${{ runner.temp }}/beta-source
      - name: Record source artifact checksums
        run: sha256sum "$RUNNER_TEMP"/beta-source/jammy/*
      - name: Install signing and upload tools
        run: sudo apt-get update && sudo apt-get install -y devscripts dput
      - name: Sign, upload and check Launchpad acceptance
        env:
          VERSION: ${{ needs.route.outputs.deb-version }}
          MARKER: ${{ needs.route.outputs.marker }}
          PPA: ${{ needs.route.outputs.ppa }}
          GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
        run: python3 scripts/launchpad-beta.py upload "$VERSION" --ppa "$PPA" --marker "$MARKER" --directory "$RUNNER_TEMP/beta-source"
      - name: Exercise recovery after Jammy acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.exercise-retry && github.run_attempt == '1'
        run: |
          echo '::error::Intentional rehearsal failure after Jammy acceptance. Rerun this original run.'
          exit 1

  resolve-publication:
    needs: [route, upload-jammy]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Copy the published Jammy binary and verify both destinations
        env:
          VERSION: ${{ needs.route.outputs.deb-version }}
          MARKER: ${{ needs.route.outputs.marker }}
          PPA: ${{ needs.route.outputs.ppa }}
          LAUNCHPAD_COPY_CREDENTIALS: ${{ secrets.LAUNCHPAD_COPY_CREDENTIALS }}
        run: |
          if [[ -n "$LAUNCHPAD_COPY_CREDENTIALS" ]]; then
            sudo apt-get update && sudo apt-get install -y python3-launchpadlib
          fi
          /usr/bin/python3 scripts/launchpad-beta.py copy "$VERSION" --ppa "$PPA" --marker "$MARKER"

  tag:
    needs: [route, resolve-publication]
    if: github.event_name == 'push' && needs.route.outputs.ppa == 'landscape/self-hosted-beta'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag the built commit
        env:
          VERSION: ${{ needs.route.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            EXISTING_SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")
            if [[ "$EXISTING_SHA" != "$SHA" ]]; then
              echo "::error::Tag $VERSION points to $EXISTING_SHA, expected $SHA."
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$VERSION" -m "Build $VERSION from $GITHUB_REF_NAME" "$SHA"
            git push origin "refs/tags/$VERSION"
          fi

  forward-port:
    needs: [route, tag]
    if: github.event_name == 'push' && needs.route.outputs.ppa == 'landscape/self-hosted-beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.LANDSCAPE_PACKAGER_APP_ID }}
          private-key: ${{ secrets.LANDSCAPE_PACKAGER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Forward-port the tagged beta history
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.route.outputs.version }}
          SHA: ${{ github.sha }}
          BOT_EMAIL: 273197409+landscape-packager[bot]@users.noreply.github.com
        run: |
          BRANCH="beta-forward-port/$VERSION"
          EXISTING=$(gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f base=main -f "head=${GITHUB_REPOSITORY_OWNER}:$BRANCH" -f state=all \
            --jq ".[] | select(.head.repo.full_name == \"$GITHUB_REPOSITORY\" and .head.ref == \"$BRANCH\") | if .merged_at then \"MERGED\" elif .state == \"open\" then \"OPEN\" else empty end")
          if [[ "$EXISTING" == MERGED ]]; then exit 0; fi
          git config user.name 'landscape-packager[bot]'
          git config user.email "$BOT_EMAIL"
          SCRIPT="$RUNNER_TEMP/forward-port-beta.sh"
          cp scripts/forward-port-beta.sh "$SCRIPT"
          bash "$SCRIPT" "$VERSION" "$SHA"
          if git diff --quiet origin/main HEAD; then
            if [[ "$EXISTING" == OPEN ]]; then
              echo 'This cut is already incorporated; close the stale forward-port PR.'
            fi
            exit 0
          fi
          if [[ -n $(git diff --name-only origin/main HEAD -- .github/workflows/) ]]; then
            echo '::error::Forward-port modifies .github/workflows/, which the Packager App cannot push. Replay these commits in a manual PR to main.'
            echo "Keep this trailer in the squash commit: Landscape-Beta-Source: $SHA"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            previous=$(git rev-parse "origin/$BRANCH")
            if git log --format=%ce "origin/main..$previous" | grep -Fxv "$BOT_EMAIL" > /dev/null; then
              echo 'Forward-port branch has non-bot commits (including manual edits or GitHub "Update branch"); update its PR by hand.'
              exit 1
            fi
            if ! git diff --quiet "$previous" HEAD || ! git merge-base --is-ancestor origin/main "$previous"; then
              git push --force-with-lease="refs/heads/$BRANCH:$previous" origin "HEAD:refs/heads/$BRANCH"
            fi
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          if [[ "$EXISTING" == OPEN ]]; then exit 0; fi
          body=$(printf 'Forward-port the release changes included in `%s` (`%s`). Preserve the following trailer in the squash commit message.\n\nLandscape-Beta-Source: %s' "$VERSION" "$SHA" "$SHA")
          gh pr create --base main --head "$BRANCH" --title "chore: forward-port beta $VERSION" --body "$body"
