name: Beta Release and PPA Build

on:
  push:
    branches: ["beta/**"]
  workflow_dispatch:
    inputs:
      exercise-retry:
        description: Fail the first attempt after Jammy accepts, to rehearse recovery on this run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'beta-ppa-rehearsal' || 'release' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.version.outputs.decision }}
      version: ${{ steps.version.outputs.version }}
      deb-version: ${{ steps.version.outputs.deb-version }}
      marker: ${{ steps.version.outputs.marker }}
      sha: ${{ steps.version.outputs.sha }}
      ppa: ${{ steps.version.outputs.ppa }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Resolve publication metadata
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            node scripts/beta-release-version.cjs --rehearsal
          else
            node scripts/beta-release-version.cjs
          fi

  prepare:
    needs: route
    if: needs.route.outputs.decision == 'prepare'
    uses: ./.github/workflows/beta-release-prep.yml
    secrets: inherit

  build:
    needs: route
    if: needs.route.outputs.decision == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Find the original dist artifact on retry
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/find-beta-artifact.sh beta-dist build
      - name: Check that the release can be built
        if: steps.retained.outputs.id == ''
        env:
          VERSION: ${{ needs.route.outputs.deb-version }}
          MARKER: ${{ needs.route.outputs.marker }}
          PPA: ${{ needs.route.outputs.ppa }}
        run: python3 scripts/launchpad-beta.py preflight "$VERSION" --ppa "$PPA" --marker "$MARKER"
      - uses: pnpm/setup@v3
        if: steps.retained.outputs.id == ''
        with:
          version: 12
          runtime: node@26
          cache: true
          require-lockfile: true
      - name: Production build
        if: steps.retained.outputs.id == ''
        run: pnpm run build
        env:
          VITE_APP_VERSION: ${{ needs.route.outputs.version }}
          VITE_APP_COMMIT: ${{ needs.route.outputs.sha }}
          VITE_API_URL: /api/v2/
          VITE_API_URL_OLD: /api/
          VITE_ROOT_PATH: /portal/
      - name: Retain beta-dist
        if: steps.retained.outputs.id == ''
        uses: actions/upload-artifact@v4
        with:
          name: beta-dist
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish-assets:
    needs: [route, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: beta-dist
          path: dist/
      - name: Publish beta assets
        env:
          VERSION: ${{ needs.route.outputs.version }}
          BUILD_SHA: ${{ needs.route.outputs.sha }}
        run: |
          DEST="ppa-build-${GITHUB_REF_NAME#beta/}"
          require_current_tip() {
            local tip
            tip=$(git ls-remote --heads origin "$GITHUB_REF" | cut -f1) || return 1
            if [[ "$tip" != "$BUILD_SHA" ]]; then
              echo "::error::Beta branch tip is ${tip:-missing}, expected $BUILD_SHA. Use the run for the current tip."
              return 1
            fi
          }
          require_current_tip
          git -C dist init --initial-branch=build
          git -C dist add --all
          git -C dist -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Build $VERSION from $GITHUB_REF_NAME [$BUILD_SHA]"
          git fetch ./dist refs/heads/build
          PREVIOUS=$(git ls-remote --heads origin "refs/heads/$DEST" | cut -f1)
          require_current_tip
          git push --force-with-lease="refs/heads/$DEST:$PREVIOUS" origin "FETCH_HEAD:refs/heads/$DEST"

  sbom:
    needs: [route, build]
    uses: ./.github/workflows/beta-sbom.yml
    with:
      version: ${{ needs.route.outputs.version }}
      sha: ${{ needs.route.outputs.sha }}

  package-source:
    needs: [route, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.route.outputs.sha }}
          persist-credentials: false
      - name: Find the original source artifact on retry
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/find-beta-artifact.sh beta-source package-source
      - uses: actions/download-artifact@v4
        if: steps.retained.outputs.id == ''
        with:
          name: beta-dist
          path: dist/
      - name: Prepare Jammy source package
        if: steps.retained.outputs.id == ''
        env:
          DEB_VERSION: ${{ needs.route.outputs.deb-version }}
          MARKER: ${{ needs.route.outputs.marker }}
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential debhelper dpkg-dev
          bash scripts/build-beta-source.sh "$DEB_VERSION" "$RUNNER_TEMP/beta-source" "$MARKER"
      - name: Retain beta-source
        if: steps.retained.outputs.id == ''
        uses: actions/upload-artifact@v4
        with:
          name: beta-source
          path: ${{ runner.temp }}/beta-source
          retention-days: 30
          if-no-files-found: error

  upload-jammy:
    needs: [route, package-source, publish-assets]
    if: >-
      !cancelled() && needs.route.result == 'success' && needs.package-source.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && needs.publish-assets.result == 'skipped') ||
       (github.event_name == 'push' && needs.publish-assets.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Find the original upload inputs on retry
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/find-beta-artifact.sh beta-source package-source
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.retained.outputs.id == '' && 'beta-source' || '' }}
          artifact-ids: ${{ steps.retained.outputs.id }}
          github-token: ${{ steps.retained.outputs.id != '' && github.token || '' }}
          merge-multiple: true
          path: ${{ runner.temp }}/beta-source
      - name: Record source artifact checksums
        run: sha256sum "$RUNNER_TEMP"/beta-source/jammy/*
      - name: Install signing and upload tools
        run: sudo apt-get update && sudo apt-get install -y devscripts dput
      - name: Sign, upload and check Launchpad acceptance
        env:
          VERSION: ${{ needs.route.outputs.deb-version }}
          MARKER: ${{ needs.route.outputs.marker }}
          PPA: ${{ needs.route.outputs.ppa }}
          GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
        run: python3 scripts/launchpad-beta.py upload "$VERSION" --ppa "$PPA" --marker "$MARKER" --directory "$RUNNER_TEMP/beta-source"
      - name: Exercise recovery after Jammy acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.exercise-retry && github.run_attempt == '1'
        run: |
          echo '::error::Intentional rehearsal failure after Jammy acceptance. Rerun this original run.'
          exit 1

  resolve-publication:
    needs: [route, upload-jammy]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Copy the published Jammy binary and verify both destinations
        env:
          VERSION: ${{ needs.route.outputs.deb-version }}
          MARKER: ${{ needs.route.outputs.marker }}
          PPA: ${{ needs.route.outputs.ppa }}
          LAUNCHPAD_COPY_CREDENTIALS: ${{ secrets.LAUNCHPAD_COPY_CREDENTIALS }}
        run: |
          if [[ -n "$LAUNCHPAD_COPY_CREDENTIALS" ]]; then
            sudo apt-get update && sudo apt-get install -y python3-launchpadlib
          fi
          /usr/bin/python3 scripts/launchpad-beta.py copy "$VERSION" --ppa "$PPA" --marker "$MARKER"

  tag:
    needs: [route, resolve-publication]
    if: github.event_name == 'push' && needs.route.outputs.ppa == 'landscape/self-hosted-beta'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.route.outputs.sha }}
          fetch-depth: 0
      - name: Tag the built commit
        env:
          VERSION: ${{ needs.route.outputs.version }}
          SHA: ${{ needs.route.outputs.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            EXISTING_SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")
            if [[ "$EXISTING_SHA" != "$SHA" ]]; then
              echo "::error::Tag $VERSION points to $EXISTING_SHA, expected $SHA."
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$VERSION" -m "Build $VERSION from $GITHUB_REF_NAME" "$SHA"
            git push origin "refs/tags/$VERSION"
          fi
