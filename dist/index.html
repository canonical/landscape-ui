  <body>
    <div id="root"></div>
    <script>
      (() => {
        const saved = localStorage.getItem("_landscape_dark_theme");
        const systemDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        // "true"/"false" are legacy values of the dark mode switch
        const shouldDark =
          saved === "dark" ||
          saved === "true" ||
          (saved !== "light" && saved !== "false" && systemDark);
        if (shouldDark) {
          document.body.classList.add("is-dark");
          document.body.style.colorScheme = "dark";
        }
      })();
